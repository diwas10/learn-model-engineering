<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Master Brand Gradient: Cyan to Electric Indigo to Vivid Violet -->
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="48%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#A855F7" />
    </linearGradient>

    <!-- Deep Space Chamber Background -->
    <linearGradient id="darkBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060B17" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>

    <!-- Chip Gradient -->
    <linearGradient id="chipGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#1E1B4B" />
    </linearGradient>
  </defs>

  <!-- Outer Neon Glow Rim -->
  <rect x="8" y="8" width="496" height="496" rx="118" fill="url(#brandGrad)" />

  <!-- Inner Deep Chamber -->
  <rect x="26" y="26" width="460" height="460" rx="104" fill="url(#darkBg)" />

  <!-- Bus Pins - Thicker & Higher Contrast for 16px/32px Tab Readability -->
  <!-- Top Pins -->
  <line x1="184" y1="60" x2="184" y2="130" stroke="#00F0FF" stroke-width="22" stroke-linecap="round" />
  <line x1="256" y1="48" x2="256" y2="130" stroke="#38BDF8" stroke-width="24" stroke-linecap="round" />
  <line x1="328" y1="60" x2="328" y2="130" stroke="#818CF8" stroke-width="22" stroke-linecap="round" />

  <!-- Bottom Pins -->
  <line x1="184" y1="382" x2="184" y2="452" stroke="#6366F1" stroke-width="22" stroke-linecap="round" />
  <line x1="256" y1="382" x2="256" y2="464" stroke="#8B5CF6" stroke-width="24" stroke-linecap="round" />
  <line x1="328" y1="382" x2="328" y2="452" stroke="#A855F7" stroke-width="22" stroke-linecap="round" />

  <!-- Left Pins -->
  <line x1="60" y1="184" x2="130" y2="184" stroke="#00F0FF" stroke-width="22" stroke-linecap="round" />
  <line x1="48" y1="256" x2="130" y2="256" stroke="#38BDF8" stroke-width="24" stroke-linecap="round" />
  <line x1="60" y1="328" x2="130" y2="328" stroke="#6366F1" stroke-width="22" stroke-linecap="round" />

  <!-- Right Pins -->
  <line x1="382" y1="184" x2="452" y2="184" stroke="#818CF8" stroke-width="22" stroke-linecap="round" />
  <line x1="382" y1="256" x2="464" y2="256" stroke="#A855F7" stroke-width="24" stroke-linecap="round" />
  <line x1="382" y1="328" x2="452" y2="328" stroke="#C084FC" stroke-width="22" stroke-linecap="round" />

  <!-- Central Processor Die -->
  <rect x="124" y="124" width="264" height="264" rx="54" fill="url(#chipGrad)" stroke="url(#brandGrad)" stroke-width="16" />

  <!-- Neural Highway / Matrix Cross Links -->
  <line x1="184" y1="184" x2="328" y2="328" stroke="#00F0FF" stroke-width="12" opacity="0.75" />
  <line x1="328" y1="184" x2="184" y2="328" stroke="#A855F7" stroke-width="12" opacity="0.75" />
  <line x1="184" y1="256" x2="328" y2="256" stroke="#FFFFFF" stroke-width="10" opacity="0.95" />
  <line x1="256" y1="184" x2="256" y2="328" stroke="#FFFFFF" stroke-width="10" opacity="0.95" />

  <!-- Neural Synapse Nodes -->
  <!-- Top Row -->
  <circle cx="184" cy="184" r="22" fill="#00F0FF" />
  <circle cx="256" cy="184" r="18" fill="#E0E7FF" />
  <circle cx="328" cy="184" r="22" fill="#A855F7" />

  <!-- Middle Row -->
  <circle cx="184" cy="256" r="18" fill="#38BDF8" />
  
  <!-- Tensor Processing Accelerator Core (White with Violet Center) -->
  <rect x="228" y="228" width="56" height="56" rx="14" fill="#FFFFFF" />
  <circle cx="256" cy="256" r="15" fill="#4F46E5" />
  
  <circle cx="328" cy="256" r="18" fill="#C084FC" />

  <!-- Bottom Row -->
  <circle cx="184" cy="328" r="22" fill="#38BDF8" />
  <circle cx="256" cy="328" r="18" fill="#818CF8" />
  <circle cx="328" cy="328" r="22" fill="#E879F9" />
</svg>